<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share HopOn</title>
<meta property="og:title" content="HopOn">
<meta property="og:description" content="The operating system for the equestrian world.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F6F4EF; --green:#0E3A2C; --euc:#2A957F; --ink:#16271F; --muted:#6b7b73; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:420px;text-align:center}
  .logo{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:30px;color:var(--green);margin-bottom:6px}
  .logo .a{color:var(--euc)}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:26px;line-height:1.15;margin:18px 0 8px}
  p{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 26px}
  .share{display:inline-flex;align-items:center;gap:10px;background:var(--euc);color:#fff;border:0;
    font:600 17px 'Hanken Grotesk',sans-serif;padding:15px 30px;border-radius:999px;cursor:pointer;text-decoration:none}
  .share:active{transform:scale(.98)}
  .alt{margin-top:26px}
  .alt .lbl{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #e2ddd2;color:var(--ink);
    text-decoration:none;font:600 14px 'Hanken Grotesk',sans-serif;padding:11px 16px;border-radius:12px;cursor:pointer}
  .chip:active{background:#eef2ee}
  .hidden{display:none}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;
    padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  footer{margin-top:34px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">H<span class="a">o</span>p<span class="a">O</span>n</div>
    <h1>Share HopOn</h1>
    <p>The operating system for the equestrian world. Pass it on to a barn, trainer, or rider who'd want in.</p>

    <button class="share" id="nativeShare">Share HopOn</button>

    <div class="alt hidden" id="fallback">
      <div class="lbl">Or share via</div>
      <div class="row">
        <a class="chip" id="waBtn" target="_blank" rel="noopener">WhatsApp</a>
        <a class="chip" id="mailBtn">Email</a>
        <a class="chip" id="liBtn" target="_blank" rel="noopener">LinkedIn</a>
        <a class="chip" id="xBtn" target="_blank" rel="noopener">X</a>
        <button class="chip" id="copyBtn">Copy link</button>
      </div>
    </div>

    <footer>HopOn — within the Voltaire Group</footer>
  </div>

  <div class="toast" id="toast">Link copied</div>

<script>
  // What gets shared. Replace with a public HopOn landing/signup URL when ready.
  var SHARE_URL  = "https://preview.mailerlite.io/forms/2407698/189373097752659129/share";
  var SHARE_TEXT = "HopOn — the operating system for the equestrian world. Join the list:";
  var SHARE_TITLE = "HopOn";

  var btn = document.getElementById('nativeShare');
  var fallback = document.getElementById('fallback');

  function showFallback(){ fallback.classList.remove('hidden'); btn.classList.add('hidden'); wireFallback(); }

  if (navigator.share) {
    btn.addEventListener('click', async function(){
      try { await navigator.share({ title: SHARE_TITLE, text: SHARE_TEXT, url: SHARE_URL }); }
      catch(e){ /* user cancelled — do nothing */ }
    });
  } else {
    showFallback();
  }

  function wireFallback(){
    var u = encodeURIComponent(SHARE_URL), t = encodeURIComponent(SHARE_TEXT);
    document.getElementById('waBtn').href = "https://wa.me/?text=" + t + "%20" + u;
    document.getElementById('liBtn').href = "https://www.linkedin.com/sharing/share-offsite/?url=" + u;
    document.getElementById('xBtn').href  = "https://twitter.com/intent/tweet?text=" + t + "&url=" + u;
    document.getElementById('mailBtn').addEventListener('click', function(){
      window.location.href = "mailto:?subject=" + encodeURIComponent(SHARE_TITLE) + "&body=" + t + "%0A%0A" + u;
    });
    document.getElementById('copyBtn').addEventListener('click', async function(){
      try { await navigator.clipboard.writeText(SHARE_URL); }
      catch(e){ window.prompt("Copy this link:", SHARE_URL); return; }
      var toast = document.getElementById('toast');
      toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 1600);
    });
  }
</script>
</body>
</html>
